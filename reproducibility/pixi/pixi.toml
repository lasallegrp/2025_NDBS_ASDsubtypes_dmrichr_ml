[workspace]
name = "growell-wgbs-dmrichr"
version = "0.1.0"
authors = ["George Eusebio Kuodza <gekuodza@health.ucdavis.edu>"]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-64"]

[tasks]
check-pkgconfig = "pkg-config --modversion cairo freetype2 fontconfig expat"
install-gdtools = "Rscript -e 'install.packages(\"gdtools\", repos=\"https://cloud.r-project.org\")'"
test-gdtools = "Rscript -e 'packageVersion(\"gdtools\")'"
install-dmrichr = "Rscript install_dmrichr.R"
test-r = "Rscript -e 'sessionInfo()'"
test-dmrichr = "Rscript -e 'library(DMRichR); packageVersion(\"DMRichR\")'"

[dependencies]
git = "*"
curl = "*"
wget = "*"
pandoc = "*"
pkg-config = "*"

libpng = "*"
freetype = "*"
fontconfig = "*"
cairo = "*"
expat = "*"
make = "*"
gcc = "*"
gxx = "*"

r-base = "4.2.*"
r-biocmanager = "*"
r-remotes = "*"
r-optparse = "*"


# tidyverse / common CRAN pieces
r-tidyverse = "*"
r-openxlsx = "*"
r-readxl = "*"
r-readr = "*"
r-pheatmap = "*"
r-gplots = "*"
r-rcolorbrewer = "*"
"r-data.table" = "*"
r-hmisc = "*"
r-magrittr = "*"
r-rlang = "*"
r-tidyselect = "*"
r-glue = "*"
r-viridis = "*"
r-ggsci = "*"
r-gt = "*"
r-broom = "*"
r-cmplot = "*"
r-boruta = "*"
r-enrichr = "*"
r-performanceanalytics = "*"
r-lsmeans = "*"
r-r2html = "*"
r-wesanderson = "*"

# core Bioconductor stack reflected in DMRichR metadata
bioconductor-pcatools = "*"
bioconductor-biocgenerics = "*"
bioconductor-biobase = "*"
bioconductor-iranges = "*"
bioconductor-s4vectors = "*"
bioconductor-genomeinfodb = "*"
bioconductor-genomicranges = "*"
bioconductor-rtracklayer = "*"
bioconductor-annotationhub = "*"
bioconductor-biocparallel = "*"
bioconductor-plyranges = "*"
bioconductor-ensembldb = "*"
bioconductor-genomicfeatures = "*"
bioconductor-delayedmatrixstats = "*"
bioconductor-bsseq = "*"
bioconductor-dmrseq = "*"
bioconductor-minfi = "*"
bioconductor-chipseeker = "*"
bioconductor-glimma = "*"
bioconductor-lola = "*"
bioconductor-rgreat = "*"
bioconductor-rrvgo = "*"
bioconductor-sigfeature = "*"
bioconductor-gofuncr = "*"

# annotation packages
"bioconductor-org.hs.eg.db" = "*"
"bioconductor-txdb.hsapiens.ucsc.hg38.knowngene" = "*"
"bioconductor-txdb.hsapiens.ucsc.hg19.knowngene" = "*"
"bioconductor-go.db" = "*"
bioconductor-genomeinfodbdata = "*"

[activation.env]
PKG_CONFIG_PATH = "$CONDA_PREFIX/lib/pkgconfig:$CONDA_PREFIX/share/pkgconfig"
INCLUDE_DIR = "$CONDA_PREFIX/include"
LIB_DIR = "$CONDA_PREFIX/lib"